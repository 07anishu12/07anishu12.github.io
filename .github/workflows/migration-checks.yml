name: Migration release checks
on:
  pull_request:
  push:
    branches: ['migration/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Isolated synthetic CI database; never use production credentials here.
      TEST_DATABASE_URL: postgresql://portfolio_test:synthetic_ci_password@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check
      - run: pnpm --filter @portfolio/api typecheck
      - run: pnpm --filter @portfolio/api test
      - run: pnpm --filter @portfolio/api build
      - run: pnpm --filter @portfolio/web build
      - run: pnpm --filter @portfolio/web typecheck
      - run: pnpm audit --prod --audit-level high
      - run: git diff --check
      - name: Verify independently buildable API image
        run: docker build -f apps/api/Dockerfile -t portfolio-api:ci .
