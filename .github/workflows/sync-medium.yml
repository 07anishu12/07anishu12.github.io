name: Medium Article Synchronisation

on:
  workflow_run:
    workflows: ["Build and deploy portfolio"]
    types: [completed]
    branches: [main]
  schedule:
    # Daily incremental check at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate without external changes)'
        required: false
        type: boolean
        default: false
      slug:
        description: 'Target specific article slug (optional)'
        required: false
        type: string
        default: ''
      limit:
        description: 'Maximum number of articles to process in this run'
        required: false
        type: string
        default: '2'
      skip_url_check:
        description: 'Skip HTTP canonical URL availability check'
        required: false
        type: boolean
        default: false

concurrency:
  group: medium-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # Only run if triggered manually, scheduled, or if the pages deployment workflow concluded successfully
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronise articles to Medium
        env:
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            FLAGS="$FLAGS --slug ${{ inputs.slug }}"
          fi
          if [ "${{ inputs.skip_url_check }}" = "true" ]; then
            FLAGS="$FLAGS --skip-url-check"
          fi
          LIMIT="${{ inputs.limit || '2' }}"
          node scripts/sync-medium.mjs --limit "$LIMIT" $FLAGS

      - name: Commit synchronisation state
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git status --porcelain data/medium-sync.json docs/medium-import-queue.md | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/medium-sync.json docs/medium-import-queue.md
            git commit -m "chore(sync): update Medium synchronisation state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
