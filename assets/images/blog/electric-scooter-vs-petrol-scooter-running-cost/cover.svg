        <text x="80" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">electric scooter vs </text>

        <rect x="175" y="0" width="170" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="260" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">bike mileage india 202</text>
