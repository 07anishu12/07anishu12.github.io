        <text x="0" y="0" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">Electric Scooter vs Petrol</text>
      
        <text x="0" y="44" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">Scooter: Running Cost per 100 km</text>
      
        <text x="0" y="88" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">in India</text>
      
