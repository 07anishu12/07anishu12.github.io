<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Royal Enfield Himalayan 450 vs KTM 390 Adventure: Mileage and Long-Distance Riding Costs">
  <defs>
    <linearGradient id="bgGrad_2119461691" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <pattern id="dotGrid_2119461691" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad_2119461691)"/>
  <rect width="1200" height="675" fill="url(#dotGrid_2119461691)"/>

  <!-- Outer Fine Card Border -->
  <rect x="36" y="36" width="1128" height="603" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left Editorial Typography Column -->
  <g transform="translate(85, 95)">
    <!-- Top Pillar Badges -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#FFEDD5" stroke="#C2410C" stroke-opacity="0.3"/>
    <circle cx="16" cy="16" r="4.5" fill="#C2410C"/>
    <text x="28" y="21" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#9A3412" letter-spacing="1">AUTO</text>
    
    <text x="175" y="21" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#64748B">ADVENTURE CHASSIS</text>

    <!-- Main Title Multi-line -->
    <g transform="translate(0, 75)">
      
        <text x="0" y="0" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">Royal Enfield Himalayan 450 vs</text>
      
        <text x="0" y="44" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">KTM 390 Adventure: Mileage and</text>
      
        <text x="0" y="88" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">Long-Distance Riding Costs</text>
      
    </g>

    <!-- Subtitle / Series -->
    <g transform="translate(0, 222)">
      <text x="0" y="16" font-family="Newsreader, Georgia, serif" font-size="19" font-style="italic" fill="#C2410C">
        Technical Library · Verified Research
      </text>

      <!-- Topic Pill Badges -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="160" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="80" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">royal enfield himala</text>

        <rect x="175" y="0" width="170" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="260" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">royal enfield himalaya</text>
      </g>
    </g>

    <!-- Author & Research Attribution Stamp -->
    <g transform="translate(0, 445)">
      <circle cx="16" cy="16" r="16" fill="#C2410C"/>
      <text x="16" y="21" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">AT</text>
      <text x="44" y="14" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Aniket Thakur</text>
      <text x="44" y="29" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="11" fill="#64748B">Engineering &amp; Research Library · 2026-10-29</text>
    </g>
  </g>

  <!-- Right Visual Illustration Component -->
  
    <g transform="translate(640, 150)">
      <rect width="470" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M 0 0 L 470 0 L 470 36 L 0 36 Z" fill="#F8FAFC" rx="12"/>
      <circle cx="20" cy="18" r="4" fill="#C2410C"/>
      <text x="32" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="1">ADVENTURE ENDURO CHASSIS · LONG TRAVEL</text>

