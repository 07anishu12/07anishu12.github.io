      <line x1="40" y1="315" x2="430" y2="315" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="235" y="335" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748B" text-anchor="middle">SUSPENSION TRAVEL: 220 MM · 21" FRONT</text>

      <!-- Rear Wheel (17-18 inch) -->
      <circle cx="115" cy="240" r="50" fill="none" stroke="#0F172A" stroke-width="6"/>
      <circle cx="115" cy="240" r="36" fill="none" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="115" cy="240" r="14" fill="#0F172A"/>
      <!-- Front Wheel (21 inch) -->
      <circle cx="365" cy="230" r="58" fill="none" stroke="#0F172A" stroke-width="6"/>
      <circle cx="365" cy="230" r="44" fill="none" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="365" cy="230" r="14" fill="#0F172A"/>

      <!-- High Front Beak & Screen -->
      <path d="M 330 90 L 310 50 L 330 50" fill="none" stroke="#94A3B8" stroke-width="3"/>
      <path d="M 320 110 L 375 130 L 340 145 Z" fill="#C2410C" stroke="#0F172A" stroke-width="2"/>

      <!-- USD Inverted Front Forks -->
      <line x1="365" y1="230" x2="325" y2="90" stroke="#C2410C" stroke-width="5"/>
      <line x1="358" y1="230" x2="318" y2="90" stroke="#0F172A" stroke-width="2"/>

      <!-- Large Fuel Tank & Skid Plate -->
      <path d="M 215 135 C 220 100, 275 90, 325 110 L 265 170 Z" fill="#C2410C" fill-opacity="0.2" stroke="#C2410C" stroke-width="2.5"/>
      <path d="M 190 240 L 260 240 L 280 200 L 190 200 Z" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
      <rect x="180" y="240" width="80" height="8" rx="2" fill="#0F172A"/>

      <!-- Trellis Frame -->
      <line x1="210" y1="140" x2="260" y2="190" stroke="#0F172A" stroke-width="3"/>
      <line x1="260" y1="190" x2="310" y2="130" stroke="#0F172A" stroke-width="3"/>
      <line x1="210" y1="140" x2="310" y2="130" stroke="#0F172A" stroke-width="3"/>

      <!-- Tall ADV Seat & Luggage Rack -->
      <path d="M 130 145 C 165 145, 185 145, 220 140 L 210 160 L 140 160 Z" fill="#0F172A"/>
      <line x1="90" y1="145" x2="135" y2="145" stroke="#64748B" stroke-width="3"/>

      <!-- High-mounted Exhaust -->
      <path d="M 230 230 L 190 210 L 120 180" fill="none" stroke="#64748B" stroke-width="4.5"/>

      <!-- Telemetry Box -->
      <rect x="25" y="55" width="120" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="35" y="73" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#64748B">RIDE MODES</text>
      <text x="35" y="90" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0F172A">ENDURO / OFF</text>

      <rect x="325" y="55" width="120" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="335" y="73" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#64748B">SEAT HEIGHT</text>
      <text x="335" y="90" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#C2410C">835-855 MM</text>
    </g>
  
</svg>