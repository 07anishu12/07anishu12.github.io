    <text x="30" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#1E40AF" letter-spacing="1">PRODUCT MANAGEMENT</text>
    
    <text x="195" y="22" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#6B7280">PROD-005</text>

    <text x="0" y="85" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#121316" letter-spacing="-0.5">Best Product Management</text>
    <text x="0" y="132" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#121316" letter-spacing="-0.5">Tools: Jira, Linear,</text>
    <text x="0" y="179" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#121316" letter-spacing="-0.5">Notion, Figma and Alternatives</text>

    <g transform="translate(0, 220)">
      <text x="0" y="24" font-family="Newsreader, Georgia, serif" font-size="19" font-style="italic" fill="#2563EB">
        Jira vs. Linear, Notion, Figma &amp; Annual Stack TCO
      </text>
      
      <g transform="translate(0, 50)">
        
          <rect x="0" y="0" width="165" height="28" rx="6" fill="#F3F4F6"/>
          <text x="82" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle">Jira vs Linear</text>
        
          <rect x="175" y="0" width="165" height="28" rx="6" fill="#F3F4F6"/>
          <text x="257" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle">Tool Stack</text>
        
      </g>
    </g>

    <g transform="translate(0, 440)">
      <circle cx="16" cy="16" r="16" fill="#2563EB"/>
      <text x="16" y="21" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">AT</text>
      <text x="44" y="14" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#121316">Aniket Thakur</text>
      <text x="44" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#6B7280">Researched &amp; Verified · 2026 Edition</text>
