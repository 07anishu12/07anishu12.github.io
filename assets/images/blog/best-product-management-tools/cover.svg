  <g transform="translate(620, 140)">
    <rect width="460" height="395" rx="14" fill="#FFFFFF" stroke="#E5E2D9" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.04))"/>
