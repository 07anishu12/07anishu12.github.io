    <text x="45" y="298" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#C2410C">Design &amp; Telemetry</text>
    <text x="45" y="320" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#374151">Figma interactive wireframes + Amplitude cohort metrics.</text>
