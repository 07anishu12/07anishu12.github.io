    <text x="45" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#374151">Linear (Keyboard speed) or Jira (Cross-project plans).</text>
  
    <rect x="30" y="173" width="400" height="84" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
