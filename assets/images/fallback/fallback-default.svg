    <rect x="0" y="0" width="160" height="32" rx="16" fill="#E0E7FF" stroke="#1D4ED8" stroke-opacity="0.3"/>
    <circle cx="16" cy="16" r="4.5" fill="#1D4ED8"/>
    <text x="28" y="21" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1E40AF" letter-spacing="1">TECHNOLOGY</text>
    
    <text x="175" y="21" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#64748B">SYSTEM ARCHITECTURE</text>

    <!-- Main Title Multi-line -->
    <g transform="translate(0, 75)">
      
        <text x="0" y="0" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">Engineering &amp; Technical</text>
      
        <text x="0" y="44" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.6">Publication Library</text>
      
    </g>

    <!-- Subtitle / Series -->
    <g transform="translate(0, 178)">
