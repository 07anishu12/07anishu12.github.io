      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <pattern id="dotGrid_1097621078" width="24" height="24" patternUnits="userSpaceOnUse">
