        <text x="80" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">DEFAULT</text>

        <rect x="175" y="0" width="170" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="260" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">RESEARCH GUIDE</text>
      </g>
    </g>

    <!-- Author & Research Attribution Stamp -->
    <g transform="translate(0, 445)">
      <circle cx="16" cy="16" r="16" fill="#1D4ED8"/>
      <text x="16" y="21" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">AT</text>
      <text x="44" y="14" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Aniket Thakur</text>
      <text x="44" y="29" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="11" fill="#64748B">Engineering &amp; Research Library · November 2026</text>
    </g>
  </g>

  <!-- Right Visual Illustration Component -->
  
    <g transform="translate(640, 150)">
      <rect width="470" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M 0 0 L 470 0 L 470 36 L 0 36 Z" fill="#F8FAFC" rx="12"/>
      <circle cx="20" cy="18" r="4" fill="#1D4ED8"/>
      <text x="32" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="1">EVENT-DRIVEN ARCHITECTURE &amp; TRANSACTION PIPELINE</text>

      <!-- Architecture Nodes -->
      <g transform="translate(30, 60)">
        <!-- Client / API Gateway -->
        <rect x="0" y="30" width="90" height="60" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
        <text x="45" y="58" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">API GW</text>
        <text x="45" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748B" text-anchor="middle">REST / gRPC</text>

        <!-- Arrow to Outbox -->
        <line x1="90" y1="60" x2="135" y2="60" stroke="#1D4ED8" stroke-width="2"/>
        <polygon points="135,60 128,56 128,64" fill="#1D4ED8"/>

        <!-- Transactional Outbox Node -->
        <rect x="140" y="20" width="130" height="80" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5"/>
        <text x="205" y="48" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">TRANSACTIONAL</text>
        <text x="205" y="64" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">OUTBOX</text>
        <text x="205" y="84" font-family="JetBrains Mono, monospace" font-size="9" fill="#1E40AF" text-anchor="middle">ACID PG COMMIT</text>

        <!-- Arrow to Worker Pool -->
        <line x1="270" y1="60" x2="315" y2="60" stroke="#1D4ED8" stroke-width="2"/>
        <polygon points="315,60 308,56 308,64" fill="#1D4ED8"/>

        <!-- Worker Pool -->
        <rect x="320" y="30" width="90" height="60" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
        <text x="365" y="58" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">WORKER</text>
        <text x="365" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748B" text-anchor="middle">ASYNC POOL</text>
      </g>

      <!-- Code Snippet / AST Box -->
      <g transform="translate(30, 185)">
        <rect width="410" height="150" rx="8" fill="#0F172A"/>
        <circle cx="20" cy="18" r="4" fill="#EF4444"/>
        <circle cx="34" cy="18" r="4" fill="#F59E0B"/>
        <circle cx="48" cy="18" r="4" fill="#10B981"/>
        <text x="70" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">pipeline_contract.py · STRICT TYPES</text>

        <text x="20" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#38BDF8">async def</text>
        <text x="95" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#F8FAFC">dispatch_event(payload: EventMessage) -&gt; Result:</text>
        
        <text x="35" y="76" font-family="JetBrains Mono, monospace" font-size="11" fill="#F8FAFC">async with db.transaction(isolation="serializable"):</text>
        <text x="50" y="98" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">record = await outbox.insert(payload.to_record())</text>
        <text x="50" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#4ADE80">return Result.ok(tx_id=record.id, verified=True)</text>
      </g>
    </g>
  
</svg>